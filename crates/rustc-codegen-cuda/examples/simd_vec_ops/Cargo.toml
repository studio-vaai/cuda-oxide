[package]
name = "simd_vec_ops"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Standalone crate (not part of the parent workspace).
[workspace]

# Vector load/store lowering test for genuine LLVM vector types.
#
# Each kernel loads a whole `#[repr(simd)]` vector `<N x T>` from a global
# slice and stores it back. Because these lower to real LLVM vector types
# (not struct-wrapped arrays), and a vector type's ABI alignment IS its width,
# the whole load/store fuses into a SOUND vectorized PTX instruction
# (`ld.v2`/`ld.v4` / `st.v2`/`st.v4`, i.e. 64/128-bit transactions) rather than
# N scalar `ld`/`st`.
#
# A scalar contrast kernel (a plain `#[repr(C)]` array wrapper, the CuSimd
# shape) is included to show it stays scalar.
#
# Build (no GPU required to emit/inspect PTX):
#   cargo oxide build simd_vec_ops
# Then check vectorization (pass/fail):
#   ./analyze.sh

[dependencies]
# Device-side: DisjointSlice, kernel/cuda_module macros, thread.
cuda-device = { path = "../../../cuda-device" }

# Host-side glue generated by #[cuda_module] (typed launch, module load).
cuda-host = { path = "../../../cuda-host" }

# Host-side CUDA runtime (referenced by the generated module glue).
cuda-core = { path = "../../../cuda-core" }
