[package]
name = "cusimd_ops"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Standalone crate (not part of the parent workspace).
[workspace]

# Vector load/store lowering probe for `CuSimd<T, N>`.
#
# Each kernel loads a whole `CuSimd<T, N>` from a global `&[CuSimd<T, N>]`
# and stores it back through a `DisjointSlice<CuSimd<T, N>>`. The point is to
# inspect the generated PTX (`cusimd_ops.ptx`) and check whether these whole-
# vector loads/stores lower to the vectorized PTX memory instructions
# (`ld.global.v2`, `ld.global.v4`, `st.global.v2`, `st.global.v4`) or fall back
# to scalar loads/stores.
#
# Build (no GPU required to emit/inspect PTX):
#   cargo oxide build cusimd_ops
# Then inspect:
#   grep -nE 'ld\.global|st\.global' cusimd_ops.ptx

[dependencies]
# Device-side: CuSimd, DisjointSlice, kernel/cuda_module macros, thread.
cuda-device = { path = "../../../cuda-device" }

# Host-side glue generated by #[cuda_module] (typed launch, module load).
cuda-host = { path = "../../../cuda-host" }

# Host-side CUDA runtime (referenced by the generated module glue).
cuda-core = { path = "../../../cuda-core" }
